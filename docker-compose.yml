services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: workbench-pg
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench123
      POSTGRES_DB: workbench
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: workbench-redis
    ports:
      - "6380:6379"

  minio:
    image: minio/minio
    container_name: workbench-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  pgdata:
  minio_data:
